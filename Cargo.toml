[package]
name = "proxy-demo"
version = "0.1.0"
edition = "2021"
description = "Linux scheduler benchmark for locking priority inversion"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.36"
nix = { version = "0.30", features = ["fs", "sched", "time"] }
